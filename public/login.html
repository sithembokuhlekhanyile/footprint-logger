<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Footprint Logger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f7d6d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><span class="brand-mark"></span> Footprint Logger</a>
    <nav data-nav></nav>
  </header>
  <main class="container narrow">
    <section class="card auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to see your dashboard, weekly summaries and tips.</p>
      <p class="notice" data-info hidden></p>
      <form data-auth-form="login">
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required minlength="1"></label>

        <p class="error" data-error></p>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <p class="muted switch">New here? <a href="/register">Create an account</a></p>
    </section>
  </main>
  <script src="/js/factors.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
