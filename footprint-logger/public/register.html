<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Footprint Logger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f7d6d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand"><span class="brand-mark"></span> Footprint Logger</a>
    <nav data-nav></nav>
  </header>
  <main class="container narrow">
    <section class="card auth-card">
      <h1>Create your account</h1>
      <p class="muted">Keep your history, track weekly goals and compare with the community.</p>
      <p class="notice" data-info hidden></p>
      <form data-auth-form="register">
        <label>Name <input name="name" autocomplete="name" required maxlength="60"></label>
        <label>Email <input type="email" name="email" autocomplete="email" required></label>
        <label>Password <input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
        <p class="hint">At least 8 characters.</p>

        <p class="error" data-error></p>
        <button class="btn btn-block" type="submit">Create account</button>
      </form>
      <p class="muted switch">Already have an account? <a href="/login">Log in</a></p>
    </section>
  </main>
  <script src="/js/factors.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
